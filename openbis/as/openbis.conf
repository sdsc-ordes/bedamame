#
# openBIS configuration file
#

#
# Home directory of the JRE that should be used
#
#JAVA_HOME=${JAVA_HOME:=/usr/java/latest}

#
# General options to the JRE
#
JAVA_OPTS="-server --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"

#
# Memory options to the JRE
#
JAVA_MEM_OPTS="-XX:+UseG1GC -XX:MaxRAMPercentage=60"

#
# OpenBIS options
#
# admin may import validation scripts (7.0 default: only system); local instance only
OPENBIS_OPTS="-Dch.ethz.sis.openbis.v3.searchcache.size=25% -Das.code-plugins.allowed-editing-users=system,admin"
