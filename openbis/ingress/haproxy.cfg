# Copy of /tmp/haproxy.cfg from openbis/openbis-local, plus the RO-Crate server route.
global
  maxconn 1024
  ssl-default-bind-ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS
  ssl-default-bind-options no-sslv3
  tune.ssl.default-dh-param 2048

defaults
  mode http
  option dontlognull
  option redispatch
  retries 3
  maxconn 2048
  timeout connect 10s
  timeout check   30s
  timeout client  30s
  timeout server  60s

frontend openbis_ingress
  bind *:443 ssl crt /etc/ssl/private
  acl is_as path_beg /openbis
  acl is_dss path_beg /datastore_server
  acl is_afs path_beg /afs-server
  acl is_roc path_beg /ro-crate-server /openbis/open-api/ro-crate
  http-request set-path %[path,regsub(^/ro-crate-server,/openbis/open-api/ro-crate)] if is_roc
  use_backend openbis_roc if is_roc
  use_backend openbis_as if is_as
  use_backend openbis_dss if is_dss
  use_backend openbis_afs if is_afs
  default_backend openbis_as

backend openbis_as
  option forwardfor
  option http-keep-alive
  server as openbis-app:8080 check

backend openbis_dss
  option forwardfor
  server dss openbis-app:8081 check

backend openbis_afs
  option forwardfor
  server afs openbis-app:8085 check

backend openbis_roc
  option forwardfor
  timeout server 240s
  server roc openbis-app:8086 check
