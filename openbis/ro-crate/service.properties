# prefix needed for setting service.properties from system properties or environment variables
system.property.prefix=ro-crate.
# Server Properties
httpServerPort=8086
httpServerTimeout=30s
httpServerPublicUrl = https://local.openbis.ch/ro-crate-server
# start-openbis.sh would point this at the AS session workspace; the RO-Crate server then
# truncates the AS export it is about to download. Mounted read-only so it stays separate.
sessionWorkSpace=/data/openbis/ro-crate-workspace

enablePreview=png,jpeg,jpg,gif,bmp,tiff
enablePreviewSizeInBytes=100000000

# AFS Client Properties
httpMaxContentLength=1540165
maxReadSizeInBytes=1048576

# openBIS Client Properties
openBISUrl=http://openbis-app:8080
openBISTimeout=30000

# email properties
mailFrom=rocrate_server@localhost
mailSmtpHost=localhost
mailSmtpUser=
mailSmtpPassword =
cleanupTimeDownloadedCrates=720
cleanupTimeWaitingCrates=1440
