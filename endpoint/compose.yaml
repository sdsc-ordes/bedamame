# A local SPARQL endpoint for out/bedretto.trig: `just load`, then `queries.py --endpoint`
name: bedamame-endpoint

services:
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.4.11
    command: serve --location /data --bind 0.0.0.0:7878
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - oxigraph-data:/data

volumes:
  oxigraph-data:
